<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===================== SEO ===================== -->
  <title>AI性格診断メーカー｜5問で分かるあなたの本質タイプ</title>
  <meta name="description" content="たった5問の質問に答えるだけ。AIがあなたの性格を深層分析して、あなただけの「性格タイプ」を診断します。" />
  <meta name="robots" content="index, follow" />

  <!-- ===================== Fonts ===================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    /* RESET & BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05050f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --text: #f0eeff;
      --muted: rgba(255,255,255,0.4);
      --accent1: #7c3aed;
      --accent2: #db2777;
      --grad: linear-gradient(135deg, var(--accent1), var(--accent2));
      --radius: 18px;
      --max-w: 560px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; overflow-x: hidden; }

    /* BACKGROUND */
    #bg-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
    .orb-a { width: 500px; height: 500px; background: radial-gradient(circle, #7c3aed 0%, transparent 70%); top: -150px; left: -150px; }
    .orb-b { width: 400px; height: 400px; background: radial-gradient(circle, #db2777 0%, transparent 70%); bottom: -100px; right: -100px; }

    #app { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 0 16px 60px; }
    header { width: 100%; max-width: var(--max-w); padding: 24px 0; display: flex; align-items: center; justify-content: center; }
    .site-logo { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* AD SLOT: 忍者AdMax用 */
    .ad-slot { width: 100%; max-width: var(--max-w); margin: 24px 0; text-align: center; display: flex; justify-content: center; }

    .card { width: 100%; max-width: var(--max-w); background: var(--surface); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 36px; }
    .hero-title { font-family: 'Syne', sans-serif; font-size: clamp(30px, 8vw, 46px); font-weight: 800; line-height: 1.1; margin-bottom: 24px; background: linear-gradient(140deg, #fff 40%, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-primary { display: block; width: 100%; padding: 18px; border: none; border-radius: 14px; background: var(--grad); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    .btn-primary:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

<div id="bg-canvas">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
</div>

<div id="app">
  <header><span class="site-logo">✦ AI SHINDAN</span></header>

  <!-- 上部広告エリア -->
  <div class="ad-slot">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/88f52a87985de7fcb2b4f158f8599c16"></script>
    <!-- admax -->
  </div>

  <!-- メインコンテンツ -->
  <div id="screen-intro" class="card">
    <div class="hero-title">AI性格<br>診断メーカー</div>
    <p style="margin-bottom: 24px; color: var(--muted);">たった5問であなたの深層心理をAIが解明します。</p>
    <button class="btn-primary" onclick="startQuiz()">診断スタート →</button>
  </div>

  <div id="screen-quiz" class="card" style="display:none">
    <div id="q-text" style="font-size: 20px; font-weight: 700; margin-bottom: 24px;"></div>
    <div id="options" style="display: grid; gap: 12px;"></div>
  </div>

  <div id="screen-loading" class="card" style="display:none">
    <div style="text-align:center;">AIが分析中...</div>
  </div>

  <div id="screen-result" class="card" style="display:none"></div>

  <!-- 下部広告エリア -->
  <div class="ad-slot">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/88f52a87985de7fcb2b4f158f8599c16"></script>
    <!-- admax -->
  </div>

  <footer style="margin-top: 40px; color: var(--muted); font-size: 12px;">
    © 2026 AI性格診断メーカー
  </footer>
</div>

<script>
  // 以前作成したJavaScriptのロジック（質問データや表示の切り替え関数）をここに統合して使用してください
  function startQuiz() {
    document.getElementById('screen-intro').style.display = 'none';
    document.getElementById('screen-quiz').style.display = 'block';
    // 実際の診断処理（renderQuestionなど）を呼び出す
  }
</script>
</body>
</html>
}
function stopDots() { clearInterval(dotsTimer); }
